site_name: Wiki Desktop Client
site_description: Documentación técnica en equipo, docs-as-code sobre Git.
site_url: http://127.0.0.1:8766/wiki/

theme:
  name: material
  custom_dir: theme_overrides
  logo: branding/logo-white.png
  favicon: branding/favicon.ico
  # false desactiva el <link> a Google Fonts (confirmado en
  # material/templates/base.html: "if config.theme.font != false") --
  # sin esto la wiki no carga bien sin internet aunque el contenido ya
  # este sincronizado. Cae a la pila de fuentes del sistema.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a preferencia del sistema
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy

# mermaid.min.js vendorizado en vendor/ (copiado al build por
# hooks/copy_vendor.py): mkdocs-material solo baja Mermaid de unpkg.com
# si "window.mermaid" todavia no existe (confirmado en su bundle.js), asi
# que declararlo aqui hace que use esta copia local y nunca llame al CDN.
extra_javascript:
  - vendor/mermaid.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - tables
  - toc:
      permalink: true

hooks:
  - hooks/fix_ezlinks_anchors.py
  - hooks/slugify_urls.py
  - hooks/generate_home_redirect.py
  - hooks/expose_active_repo.py
  - hooks/copy_branding.py
  - hooks/copy_vendor.py

plugins:
  - search
  - callouts
  - ezlinks:
      wikilinks: true
      warn_ambiguities: true
  - embed_file:
      callouts: true

docs_dir: synced_docs
# Sin `nav:` fijo a proposito: cada equipo conecta un repo con su propia
# estructura de carpetas, MkDocs genera la navegacion automaticamente a
# partir de lo que exista en docs_dir.
