site_name: Wiki Desktop Client
site_description: Documentación técnica en equipo, docs-as-code sobre Git.
site_url: http://127.0.0.1:8765/

theme:
  name: material
  custom_dir: theme_overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a preferencia del sistema
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - tables
  - toc:
      permalink: true

hooks:
  - hooks/fix_ezlinks_anchors.py
  - hooks/slugify_urls.py
  - hooks/generate_home_redirect.py

plugins:
  - search
  - callouts
  - ezlinks:
      wikilinks: true
      warn_ambiguities: true
  - embed_file:
      callouts: true

docs_dir: synced_docs
# Sin `nav:` fijo a proposito: cada equipo conecta un repo con su propia
# estructura de carpetas, MkDocs genera la navegacion automaticamente a
# partir de lo que exista en docs_dir.
