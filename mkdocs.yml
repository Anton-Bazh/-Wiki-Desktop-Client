site_name: MARC
site_description: Documentación técnica en equipo, docs-as-code sobre Git.
site_url: http://127.0.0.1:8766/wiki/

theme:
  name: material
  custom_dir: theme_overrides
  logo: branding/logo-white.png
  favicon: branding/favicon.ico
  # false desactiva el <link> a Google Fonts (confirmado en
  # material/templates/base.html: "if config.theme.font != false") --
  # sin esto la wiki no carga bien sin internet aunque el contenido ya
  # este sincronizado. Cae a la pila de fuentes del sistema.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a preferencia del sistema
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy

# mermaid.min.js, chart.min.js y katex/ vendorizados en vendor/ (copiados
# al build por hooks/copy_vendor.py) -- mismo motivo para las tres: nunca
# depender de un CDN, la wiki debe funcionar offline una vez sincronizada.
# marc-interactive.js es codigo propio (fuente TypeScript en frontend/,
# ver frontend/README.md) -- monta/limpia las graficas de los bloques
# ```chart y renderiza las formulas de pymdownx.arithmatex en cada
# navegacion, ver su docstring para el porque.
# marc-flow.js es codigo propio aparte (fuente frontend/src/marc-flow.tsx)
# -- monta/limpia los diagramas arrastrables de los bloques ```flow.
# Mermaid sigue siendo el diagrama por defecto sin tocar; ```flow es solo
# para los casos puntuales donde de verdad hace falta mover nodos con el
# mouse. A diferencia de marc-interactive.ts, este si empaqueta
# dependencias reales de node_modules (React + @xyflow/react, que no
# ofrecen build UMD) -- por eso se compila con esbuild en vez de tsc puro,
# ver frontend/package.json.
extra_javascript:
  - vendor/mermaid.min.js
  - vendor/chart.min.js
  - vendor/katex/katex.min.js
  - vendor/marc-interactive.js
  - vendor/marc-flow.js

# extra.css vive en theme_overrides/ (el custom_dir) -- MkDocs copia sus
# archivos junto con los del tema base automaticamente, sin necesitar un
# hook propio como el de branding/vendor (que viven fuera de custom_dir).
# katex.min.css y marc-flow.css si necesitan el hook (viven en vendor/, no
# en custom_dir).
extra_css:
  - extra.css
  - vendor/katex/katex.min.css
  - vendor/marc-flow.css

markdown_extensions:
  - admonition
  # generic: true -- salida neutra (<span>/<div class="arithmatex">), no
  # atada a MathJax; marc-interactive.js la renderiza con KaTeX. Los wraps
  # en blanco dejan el LaTeX puro dentro de la burbuja (sin \(...\)/\[...\]
  # de por medio) -- menos que parsear en el navegador, ver
  # frontend/src/marc-interactive.ts. smart_dollar (default) evita que un
  # precio como "$5" se interprete como formula: exige que el $ de
  # apertura no tenga espacio pegado despues, ni el de cierre antes.
  - pymdownx.arithmatex:
      generic: true
      tex_inline_wrap: ["", ""]
      tex_block_wrap: ["", ""]
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: chart
          class: chart-block
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: flow
          class: flow-block
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - tables
  - toc:
      permalink: true
  # Iconos por shortcode (ej. :material-rocket:) -> SVG inline en el HTML,
  # via el set de iconos que mkdocs-material ya trae empaquetado
  # (material/templates/.icons/, ~7500 SVGs entre material/fontawesome/
  # octicons/simple) -- cero vendorizado nuevo, cero peticion extra en el
  # navegador, offline por construccion (verificado leyendo el generador:
  # to_svg() detecta un shortcode SIN codigo unicode -- osea un icono, no
  # un emoji real -- y lo resuelve leyendo el .svg local, nunca red).
  #
  # Limite conocido, a proposito sin resolver: la MISMA extension tambien
  # habilita shortcodes de emoji normales (ej. :smile:), que SI delegan a
  # `pymdownx.emoji` puro y ESE si arma un <img src="https://cdn...">
  # remoto -- rompe offline-first si algun repo conectado usa esa sintaxis
  # para emojis decorativos (no para iconos). Nadie pidio soporte de
  # emoji, asi que se deja documentado en vez de vendorizar Twemoji entero
  # para un caso que no se ha necesitado.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/fix_ezlinks_anchors.py
  - hooks/slugify_urls.py
  - hooks/generate_home_redirect.py
  - hooks/expose_active_repo.py
  - hooks/copy_branding.py
  - hooks/copy_vendor.py

plugins:
  - search
  - callouts
  - ezlinks:
      wikilinks: true
      warn_ambiguities: true
  - embed_file:
      callouts: true

docs_dir: synced_docs
# Sin `nav:` fijo a proposito: cada equipo conecta un repo con su propia
# estructura de carpetas, MkDocs genera la navegacion automaticamente a
# partir de lo que exista en docs_dir.
