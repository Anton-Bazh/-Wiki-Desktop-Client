{% extends "base.html" %}
{% block content %}
  <h1>Repositorio conectado</h1>
  <p class="subtitle">
    <span class="repo">{{ repo_url }}</span>
    {% if has_token %}<span class="badge">privado · token guardado</span>{% else %}<span class="badge">público</span>{% endif %}
  </p>

  {% if sync_message %}
    <div class="banner {{ 'ok' if sync_ok else 'error' }}">{{ sync_message }}</div>
  {% endif %}

  <a class="button" href="{{ wiki_url }}" target="_blank" rel="noopener">Abrir la wiki</a>

  <form method="post" action="/resync">
    <button type="submit" class="secondary">Resincronizar ahora</button>
  </form>

  <form method="post" action="/disconnect">
    <button type="submit" class="secondary">Cambiar de repositorio</button>
  </form>
{% endblock %}
